<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Price Compare</title>
</head>

<body>
    <header>
        <h1>Price Compare</h1>
    </header>

    <main>
        <div class="left">
            <table border="1" id="myTable">
                <thead>
                    <tr>
                        <th>Store</th>
                        <th>Product Name</th>
                        <th>Brand</th>
                        <th>Size</th>
                        <th>Price</th>
                        <th>Unit Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody class="products">
                    <!-- <tr>
                        <td>Bravo</td>
                        <td>Flour</td>
                        <td>Bismak</td>
                        <td><span>2.5</span>kq</td>
                        <td><span>1.2</span>AZN</td>
                        <td><span>0.48</span>AZN</td>
                        <td>
                            <a href="#edit" title="Edit">✏️</a>
                            &nbsp;
                            <a href="#delete" title="Delete" onclick="return confirm('Silinsin?')">🗑️</a>
                        </td>
                    </tr> -->
                </tbody>
            </table>
            <button id="clear">clear table</button>
        </div>
        <div class="right">
            <form class="item-form">
                <button type="submit" class="add-button">+ Add Item</button>

                <div class="form-group">
                    <label for="store-name">Store Name</label>
                    <input type="text" id="store-name" placeholder="example, A+" required>
                </div>

                <div class="form-group">
                    <label for="product-name">Product Name</label>
                    <input type="text" id="product-name" placeholder="example, Sugar" required>
                </div>

                <div class="form-group">
                    <label for="brand-name">Brand Name</label>
                    <input type="text" id="brand-name" placeholder="example, Roshen" required>
                </div>

                <div class="form-group">
                    <label for="size">Size (kg)</label>
                    <input type="number" id="size" placeholder="example, 5" min="1" required>
                </div>

                <div class="form-group">
                    <label for="price">Price (AZN)</label>
                    <input type="number" id="price" placeholder="example, 5" min="0.01" step="0.01" required>
                </div>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
